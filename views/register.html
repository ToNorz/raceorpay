<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Achronous // Register</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="auth-card">
    <div class="brand">
      <h1>ACHRONOUS BANK</h1>
      <p>Beyond Time</p>
    </div>

    <form id="registerForm">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" required minlength="3" maxlength="20">

      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="new-password" required minlength="6" maxlength="128">

      <button type="submit" class="primary">Create Account</button>
    </form>

    <div id="msg" class="msg"></div>

    <div class="switch-link">
      Already registered? <a href="/">Sign in</a>
    </div>
  </div>

  <script>
    const form = document.getElementById('registerForm');
    const msg = document.getElementById('msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.className = 'msg';
      msg.textContent = '';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (!res.ok) {
          msg.className = 'msg error';
          msg.textContent = data.error || 'Registration failed.';
          return;
        }

        msg.className = 'msg success';
        msg.textContent = 'Account created. Redirecting to sign in...';
        setTimeout(() => { window.location.href = '/'; }, 1200);
      } catch (err) {
        msg.className = 'msg error';
        msg.textContent = 'Network error. Please try again.';
      }
    });
  </script>
</body>
</html>
